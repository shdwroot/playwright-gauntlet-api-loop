name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload Gauntlet evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-evidence
          path: |
            .gauntlet/
            playwright-report/
          if-no-files-found: ignore
