openapi: 3.1.0
info:
  title: The Witness API
  version: source-derived-2026-09-12
  description: >-
    Source-derived contract for shdwroot/the-witness. It mirrors the Fastify routes and
    shared Zod contracts present on the repository's main branch. The OAuth callback is
    documented but intentionally excluded from synthetic execution because it crosses a
    third-party browser redirect and provider-token boundary.
servers:
  - url: http://127.0.0.1:4030
security:
  - BearerAuth: []
x-gauntlet-workflows:
  login-session:
    description: Log in with the isolated fixture account and inspect the bearer session.
    steps:
      - operationId: loginUser
        request:
          body:
            email: existing@example.test
            password: correct-horse-battery-staple
      - operationId: getSession
  oauth-start:
    description: Build an authorization URL locally without contacting the provider.
    steps:
      - operationId: startOAuth
        parameters:
          provider: google
        request:
          body:
            intent: login
            nextPath: /dashboard
  lookup-lifecycle:
    description: Queue, read, and email a synthetic lookup without contacting OSINT providers.
    steps:
      - operationId: createLookup
        request:
          body:
            type: email
            value: training-subject@example.test
            purpose: self_check
            authorizationConfirmed: true
        capture:
          lookupId: $response.body#/id
      - operationId: getLookup
        parameters:
          lookupId: ${steps.create.lookupId}
      - operationId: emailLookup
        parameters:
          lookupId: ${steps.create.lookupId}
  case-lifecycle:
    description: Create, inspect, update, email, and analyse a synthetic case.
    steps:
      - operationId: createCase
        request:
          body:
            title: Contract training case
            purpose: professional_investigation
        capture:
          caseId: $response.body#/id
      - operationId: getCase
        parameters:
          caseId: ${steps.create.caseId}
      - operationId: updateCase
        parameters:
          caseId: ${steps.create.caseId}
        request:
          body:
            title: Updated contract training case
      - operationId: emailCase
        parameters:
          caseId: ${steps.create.caseId}
      - operationId: analyseCase
        parameters:
          caseId: ${steps.create.caseId}
  attach-lookup-to-case:
    description: Attach a captured lookup to a captured open case.
    steps:
      - operationId: createCase
        request:
          body:
            title: Linked lookup training case
            purpose: subject_authorized
        capture:
          caseId: $response.body#/id
      - operationId: createLookup
        request:
          body:
            type: domain
            value: example.test
            purpose: subject_authorized
            authorizationConfirmed: true
        capture:
          lookupId: $response.body#/id
      - operationId: attachLookupToCase
        parameters:
          caseId: ${steps.create.caseId}
          lookupId: ${steps.create.lookupId}
  logout-last:
    description: Revoke the synthetic bearer session after every other workflow.
    steps:
      - operationId: logoutUser
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report process health.
      security: []
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      operationId: getReadiness
      summary: Report database and Redis readiness.
      security: []
      responses:
        "200":
          description: Dependencies are ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
  /v1/auth/signup:
    post:
      operationId: createUser
      summary: Create a password account and bearer session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Account and session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/auth/login:
    post:
      operationId: loginUser
      summary: Create a session with email and password.
      x-gauntlet-skip-standalone: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/session:
    get:
      operationId: getSession
      summary: Read the current bearer session.
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Revoke the current bearer session.
      x-gauntlet-skip-standalone: true
      responses:
        "204": { description: Session revoked. }
  /v1/auth/oauth/providers:
    get:
      operationId: listOAuthProviders
      summary: Report configured OAuth providers.
      security: []
      responses:
        "200":
          description: Provider availability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [google, github]
                properties:
                  google: { type: boolean }
                  github: { type: boolean }
  /v1/auth/oauth/{provider}/start:
    post:
      operationId: startOAuth
      summary: Start an OAuth transaction.
      x-gauntlet-skip-standalone: true
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthStartRequest" }
      responses:
        "200":
          description: Provider authorization URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [provider, authorizationUrl]
                properties:
                  provider: { $ref: "#/components/schemas/OAuthProvider" }
                  authorizationUrl: { type: string, minLength: 1 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuthCallback
      summary: Complete the third-party OAuth browser redirect.
      x-gauntlet-skip-standalone: true
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the web OAuth completion or error route.
  /v1/auth/oauth/exchange:
    post:
      operationId: exchangeOAuthHandoff
      summary: Exchange a one-time OAuth handoff code for a bearer session.
      x-gauntlet-skip-standalone: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthExchangeRequest" }
      responses:
        "200":
          description: OAuth session and safe next path.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthToken"
                  - type: object
                    properties:
                      nextPath: { type: string }
                      lookupId: { type: [string, "null"], format: uuid }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/lookups:
    post:
      operationId: createLookup
      summary: Queue an authorized observation.
      x-gauntlet-skip-standalone: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LookupRequest" }
      responses:
        "202":
          description: Lookup queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupSubmission" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listLookups
      summary: List the authenticated user's lookups.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 25, default: 8 }
      responses:
        "200":
          description: Recent lookups.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LookupListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/lookups/{lookupId}:
    parameters:
      - $ref: "#/components/parameters/LookupId"
    get:
      operationId: getLookup
      summary: Read one lookup report and its evidence.
      x-gauntlet-skip-standalone: true
      responses:
        "200":
          description: Lookup report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupReport" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/lookups/{lookupId}/email:
    post:
      operationId: emailLookup
      summary: Email a completed lookup report.
      x-gauntlet-skip-standalone: true
      parameters:
        - $ref: "#/components/parameters/LookupId"
      responses:
        "200":
          description: Delivery accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [delivered, recipient]
                properties:
                  delivered: { type: boolean, const: true }
                  recipient: { type: string, format: email }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/cases:
    get:
      operationId: listCases
      summary: List the authenticated user's cases.
      responses:
        "200":
          description: Cases.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CaseSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCase
      summary: Create an investigation case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCaseRequest" }
      responses:
        "201":
          description: Case created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/cases/{caseId}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getCase
      summary: Read a case and cumulative report history.
      x-gauntlet-skip-standalone: true
      responses:
        "200":
          description: Case detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCase
      summary: Update a case title or status.
      x-gauntlet-skip-standalone: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCaseRequest" }
      responses:
        "200":
          description: Case updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cases/{caseId}/email:
    post:
      operationId: emailCase
      summary: Email the latest case dossier.
      x-gauntlet-skip-standalone: true
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Delivery accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [delivered, recipient, version]
                properties:
                  delivered: { type: boolean, const: true }
                  recipient: { type: string, format: email }
                  version: { type: integer, minimum: 1 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/cases/{caseId}/lookups/{lookupId}:
    post:
      operationId: attachLookupToCase
      summary: Attach an unfiled lookup to an open case.
      x-gauntlet-skip-standalone: true
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/LookupId"
      responses:
        "200":
          description: Lookup attached and analysis requested.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attached, analysisQueued, caseId, lookupId]
                properties:
                  attached: { type: boolean, const: true }
                  analysisQueued: { type: boolean }
                  caseId: { type: string, format: uuid }
                  lookupId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/cases/{caseId}/analyse:
    post:
      operationId: analyseCase
      summary: Queue a forced cumulative case analysis.
      x-gauntlet-skip-standalone: true
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "202":
          description: Analysis queued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [caseId, status]
                properties:
                  caseId: { type: string, format: uuid }
                  status: { type: string, const: queued }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OAuthProvider" }
      example: google
    LookupId:
      name: lookupId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 00000000-0000-4000-8000-000000000001
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 00000000-0000-4000-8000-000000000001
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: api }
        version: { type: string }
        timestamp: { type: string, format: date-time }
    Ready:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, const: api }
        version: { type: string }
        timestamp: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: false
          required: [database, redis]
          properties:
            database: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        expiresAt: { type: string, format: date-time }
    AuthToken:
      allOf:
        - $ref: "#/components/schemas/AuthSession"
        - type: object
          required: [token]
          properties:
            token: { type: string, minLength: 1 }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          x-gauntlet-conflict-value: existing@example.test
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        previewSession: { type: string, format: uuid }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        previewSession: { type: string, format: uuid }
    OAuthProvider:
      type: string
      enum: [google, github]
    OAuthStartRequest:
      type: object
      additionalProperties: false
      properties:
        intent: { type: string, enum: [login, signup], default: login }
        previewSession: { type: string, format: uuid }
        nextPath: { type: string, maxLength: 2048, default: /dashboard }
        lookupId: { type: string, format: uuid }
    OAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 40, maxLength: 100, pattern: "^[a-zA-Z0-9_-]{40,100}$" }
    LookupRequest:
      type: object
      additionalProperties: false
      required: [type, value, purpose, authorizationConfirmed]
      properties:
        type: { $ref: "#/components/schemas/LookupType" }
        value: { type: string, minLength: 2, maxLength: 2048 }
        purpose: { $ref: "#/components/schemas/LookupPurpose" }
        authorizationConfirmed: { type: boolean, const: true }
        caseId: { type: string, format: uuid }
    LookupType:
      type: string
      enum: [phone, email, username, image, vin, domain, ip, business]
    LookupPurpose:
      type: string
      enum: [self_check, dating_safety, marketplace_safety, subject_authorized, professional_investigation]
    LookupSubmission:
      type: object
      additionalProperties: false
      required: [id, status, stage]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: queued }
        stage: { type: string, const: observe }
    LookupListItem:
      type: object
      required: [id, caseId, type, maskedQuery, purpose, status, createdAt, startedAt, completedAt, report]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: [string, "null"], format: uuid }
        type: { $ref: "#/components/schemas/LookupType" }
        maskedQuery: { type: string }
        purpose: { $ref: "#/components/schemas/LookupPurpose" }
        status: { type: string, enum: [queued, observing, analysing, redacting, complete, partial, failed, blocked] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        report: { type: [object, "null"] }
    LookupReport:
      allOf:
        - $ref: "#/components/schemas/LookupListItem"
        - type: object
          required: [evidence]
          properties:
            evidence: { type: array, items: { type: object } }
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        purpose: { $ref: "#/components/schemas/LookupPurpose", default: professional_investigation }
    UpdateCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        status: { type: string, enum: [open, archived] }
    CaseSummary:
      type: object
      required: [id, referenceId, title, purpose, status, lookupCount, createdAt, updatedAt, lastLookupAt]
      properties:
        id: { type: string, format: uuid }
        referenceId: { type: string }
        title: { type: string }
        purpose: { $ref: "#/components/schemas/LookupPurpose" }
        status: { type: string, enum: [open, archived] }
        lookupCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastLookupAt: { type: [string, "null"], format: date-time }
    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          required: [lookups, latestReport, reportHistory]
          properties:
            lookups: { type: array, items: { $ref: "#/components/schemas/LookupListItem" } }
            latestReport: { type: [object, "null"] }
            reportHistory: { type: array, items: { type: object } }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
  responses:
    InvalidRequest:
      description: Input failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The requested resource does not exist for the authenticated user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The requested state transition conflicts with current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: An optional provider or dependency is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
