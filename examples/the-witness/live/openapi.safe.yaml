openapi: 3.1.0
info:
  title: The Witness production-safe surface
  version: 1.0.0
  description: >-
    A deliberately small, read-only contract for running the OpenAI-assisted
    Gauntlet against production before any records or external actions are allowed.
servers:
  - url: https://the-witness-api.onrender.com
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report process health.
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      operationId: getReadiness
      summary: Report database and Redis readiness.
      responses:
        "200":
          description: Dependencies are ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
  /v1/auth/oauth/providers:
    get:
      operationId: listOAuthProviders
      summary: Report configured OAuth providers without starting OAuth.
      responses:
        "200":
          description: Provider availability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [google, github]
                properties:
                  google: { type: boolean }
                  github: { type: boolean }
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: api }
        version: { type: string }
        timestamp: { type: string, format: date-time }
    Ready:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, const: api }
        version: { type: string }
        timestamp: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: false
          required: [database, redis]
          properties:
            database: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }
