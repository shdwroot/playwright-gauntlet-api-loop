name: gauntlet-restaurant-example
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.lab
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8091 --workers 1"]
    ports:
      - "127.0.0.1:${RESTAURANT_PORT:-8091}:8091"
    environment:
      POSTGRES_USER: restaurant_lab
      POSTGRES_PASSWORD: local_disposable_only
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: restaurant
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthcheck', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
  db:
    image: postgres:15.4-alpine
    environment:
      POSTGRES_USER: restaurant_lab
      POSTGRES_PASSWORD: local_disposable_only
      POSTGRES_DB: restaurant
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 24
volumes:
  data:
